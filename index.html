<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POKEEMPIRE V3 - Bot Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Seamless redirect preserving Telegram WebApp hash (#tgWebAppData=...) and query parameters
    (function() {
      const search = window.location.search || "";
      const hash = window.location.hash || "";
      const target = "webapp/" + search + hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#02040a;color:#f8fafc;font-family:'Segoe UI',Roboto,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:20px;text-align:center;">
  <div style="max-width:400px;background:#0b0f1d;padding:24px;border-radius:16px;border:1px solid rgba(250,204,21,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.8);">
    <h2 style="color:#facc15;margin-top:0;margin-bottom:12px;">⚡ PokéEmpire Mini App</h2>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">Launching interactive Pokémon adventure in Telegram...</p>
    <a href="webapp/" style="display:inline-block;background:#facc15;color:#0b0f1d;font-weight:bold;padding:10px 20px;border-radius:8px;text-decoration:none;">Open Mini App</a>
  </div>
</body>
</html>
